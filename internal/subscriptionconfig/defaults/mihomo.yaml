mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: true
unified-delay: true
tcp-concurrent: true
profile:
  store-selected: true
  store-fake-ip: true
tun:
  enable: false
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  dns-hijack: [any:53, tcp://any:53]
dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  respect-rules: true
  default-nameserver: [223.5.5.5, 1.1.1.1]
  proxy-server-nameserver: [https://223.5.5.5/dns-query]
  direct-nameserver: [https://223.5.5.5/dns-query]
  nameserver: [https://1.1.1.1/dns-query, https://8.8.8.8/dns-query]
  nameserver-policy:
    "rule-set:cn-domain": [https://223.5.5.5/dns-query]
  fake-ip-filter: ["*.lan", "*.local", "localhost", "+.stun.*.*", "+.msftconnecttest.com", "+.msftncsi.com"]
proxies: []
proxy-groups:
  - name: 代理选择
    type: select
    proxies: [自动选择, 故障转移, "${nodes}", DIRECT]
  - name: 自动选择
    type: url-test
    proxies: ["${nodes}"]
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: 故障转移
    type: fallback
    proxies: ["${nodes}"]
    url: https://www.gstatic.com/generate_204
    interval: 300
rule-providers:
  cn-domain:
    type: http
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs
    path: ./ruleset/cn-domain.mrs
    interval: 86400
  cn-ip:
    type: http
    behavior: ipcidr
    format: mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.mrs
    path: ./ruleset/cn-ip.mrs
    interval: 86400
rules:
  - DOMAIN-SUFFIX,local,DIRECT
  - DOMAIN-SUFFIX,lan,DIRECT
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve
  - RULE-SET,cn-domain,DIRECT
  - RULE-SET,cn-ip,DIRECT,no-resolve
  - MATCH,代理选择
