name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: PxBoard-Plugins
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: MoeClub-Open/PxBoard
          ref: 24242683d015a99b50fbf4b3039fa91ff9ca95cd
          path: PxBoard
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: PxBoard-Plugins/go.mod
          cache-dependency-path: PxBoard-Plugins/go.sum
      - name: Build official plugins
        working-directory: PxBoard-Plugins
        run: go build ./...
      - name: Verify Flux nodes and subscription capability
        working-directory: PxBoard-Plugins
        run: go test ./...
      - name: Package Flux plugins for ARM64 nodes
        working-directory: PxBoard-Plugins
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm64
        run: |
          mkdir -p dist
          go build -o dist/nodes ./cmd/nodes
          go build -o dist/subscriptions ./cmd/subscriptions
      - uses: actions/upload-artifact@v4
        with:
          name: flux-plugins-linux-arm64
          path: PxBoard-Plugins/dist/
